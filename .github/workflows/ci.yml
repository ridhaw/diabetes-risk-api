name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Tests (entraînement inclus)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t diabetes-risk-api .
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name api -p 8000:8000 diabetes-risk-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"pregnancies":2,"glucose":138,"blood_pressure":72,"skin_thickness":30,"insulin":120,"bmi":33.6,"diabetes_pedigree":0.62,"age":45}'
